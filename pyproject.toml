[project]
name = "sitepulse"
version = "0.1.0"
description = "A fast async CLI that crawls a website and audits broken links, SEO and server response times."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Afik Damri" }]
keywords = ["seo", "crawler", "broken-links", "cli", "audit", "performance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management :: Link Checking",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "httpx[brotli,zstd]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "rich>=13.7",
    "pydantic>=2.7",
]

[project.urls]
Repository = "https://github.com/afikdamri/sitepulse"
Issues = "https://github.com/afikdamri/sitepulse/issues"

[project.scripts]
sitepulse = "sitepulse.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitepulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sitepulse"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = ["integration: end-to-end tests against a local HTTP server (no internet needed)"]

[tool.coverage.run]
source = ["sitepulse"]
branch = true
omit = ["*/__main__.py"]
